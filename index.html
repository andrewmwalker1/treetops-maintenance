<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3F5837" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,600;0,700;1,600;1,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Tree Tops Maintenance</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
    </style>
    <script>
      // Other half of the public/404.html GitHub Pages SPA fallback --
      // restores the originally-requested path before React Router mounts,
      // so a fresh navigation to e.g. /kiosk (the RFID magic-link redirect
      // target) or /jobs/:id lands on the right screen instead of "/".
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
