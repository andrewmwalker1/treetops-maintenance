<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tree Tops Maintenance</title>
    <script>
      // GitHub Pages has no server-side routing, so a fresh navigation to
      // any client-side route (e.g. the RFID kiosk's magic-link redirect
      // straight to /kiosk, or a bookmarked /jobs/:id) 404s here instead
      // of loading the app. Encode the requested path into a query string
      // and redirect to the real index.html, which restores it via
      // history.replaceState before React Router mounts (see the matching
      // script in index.html) -- the standard GitHub Pages SPA fallback.
      var path = location.pathname + location.search + location.hash;
      location.replace(location.origin + "/?redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
